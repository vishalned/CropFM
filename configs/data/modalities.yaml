log_level: &log_level DEBUG
start_date: &start_date 2020-03-01
end_date: &end_date 2021-12-31

modalities: # what modalities to download
  - sentinel2
  - fapar



###### Modality specific configs ######
sentinel2:
  log_level: *log_level
  name: sentinel2
  bands:
    - B1
    - B2
    - B3
    - B4
    - B5
    - B6
    - B7
    - B8
    - B8A
    - B9
    - B11
    - B12
    - SCL
    - MSK_CLDPRB
    - QA60

  date_range:
    start_date: *start_date
    end_date: *end_date

  cloud_cover_threshold: 50 # less than 50% cloud cover

fapar:
  log_level: *log_level
  name: fapar
  variables:
    - FAPAR
    - LAI

  date_range:
    start_date: *start_date
    end_date: *end_date