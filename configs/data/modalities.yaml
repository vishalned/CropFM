## GLOBALS
log_level: &log_level INFO
start_date: &start_date 2021-01-01
end_date: &end_date 2022-01-01

points_geojson_file: ${oc.env:CROPFM_DATA_DIR}/data/europe_sampled_points_merged.geojson
zarr_path: ${oc.env:CROPFM_DATA_DIR}/data/europe_data_1000.zarr
# zarr_path: /home/vnedungadi/CropFM/test_dataset.zarr ######## For testing only #########

# Optional parameters for batch processing
resume_from_batch: 0  # Start from batch 0 (beginning). Set to N to resume from batch N
batch_size: 40        # Points per batch
error_log_path: /home/vnedungadi/CropFM/failed_points.txt  # Path to error log file

modalities: # what modalities to download, name must match the function name in the modalities.py file
  - agera5
  - sentinel2
  - sentinel1
  - fapar
  - soil
  - elevation
  - worldcereal_cropmask
  - worldcereal_cropcalender

###### Modality specific configs ######
agera5:
  log_level: *log_level
  name: agera5 # any text to identify the modality
  variables:
    - 'Precipitation_Flux'
    - 'Vapour_Pressure_Mean_24h'
    - 'Temperature_Air_2m_Max_24h'
    - 'Temperature_Air_2m_Min_24h'
    - 'Temperature_Air_2m_Mean_24h'
    - 'Solar_Radiation_Flux'
    - 'Wind_Speed_10m_Mean_24h'
    - 'Derived_Relative_Humidity_2m_Max_24h'

  date_range:
    start_date: *start_date
    end_date: *end_date

sentinel1:
  log_level: *log_level
  name: sentinel1 # any text to identify the modality
  bands:
    - 'VV'
    - 'VH'
    - 'angle'

  date_range:
    start_date: *start_date
    end_date: *end_date

sentinel2:
  log_level: *log_level
  name: sentinel2 # any text to identify the modality
  bands:
    - B1
    - B2
    - B3
    - B4
    - B5
    - B6
    - B7
    - B8
    - B8A
    - B9
    - B11
    - B12
    - SCL
    - MSK_CLDPRB
    - QA60

  date_range:
    start_date: *start_date
    end_date: *end_date

  cloud_cover_threshold: 50 # less than 50% cloud cover

fapar:
  log_level: *log_level
  name: fapar
  variables:
    - FAPAR
    - LAI

  date_range:
    start_date: *start_date
    end_date: *end_date

soil:
  log_level: *log_level
  name: soil
  variables:
    - clay      # Clay content (%)
    - nitrogen  # Total nitrogen (g/kg)
    - phh2o     # Soil pH
    - soc       # Soil organic carbon (g/kg)
  
  depth_layers: # 6 total layers, we'll use 3
    - 0-5cm     # Surface layer
    - 5-15cm    # Shallow subsurface
    - 15-30cm   # Deeper subsurface

elevation:
  log_level: *log_level
  name: elevation
  bands:
    - b1

  date_range:
    start_date: *start_date
    end_date: *end_date

landcover:
  log_level: *log_level
  name: landcover
  variables:
    - 'Map'
  years: 
    - 2020
    - 2021

worldcereal_cropmask:
  log_level: *log_level
  name: worldcereal_cropmask

worldcereal_cropcalender:
  log_level: *log_level
  name: worldcereal_cropcalender

