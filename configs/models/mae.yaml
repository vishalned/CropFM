# Hydra configuration for CropMAE training

defaults:
  - _self_

# Model configuration
model:
  # Modality dimensions: dictionary mapping modality names to feature dimensions
  # Example: {modality_name: feature_dim}
  # This should match your actual data modalities
  modality_dims:
    agera5: 8  # Example: 8 variables from agera5
    sentinel1: 3  # Example: VV, VH, angle
    sentinel2: 13  # Example: 13 bands
    fapar: 2  # Example: FAPAR, LAI
    soil: 4  # Example: clay, nitrogen, phh2o, soc
    elevation: 2  # Example: elevation, slope
    worldcereal_cropmask: 1  # Example: crop mask
    worldcereal_cropcalender: 6  # Example: crop calendar variables
  
  # Architecture hyperparameters
  embedding_dim: 128
  encoder_depth: 6
  encoder_num_heads: 8
  decoder_embed_dim: 128
  decoder_depth: 2
  decoder_num_heads: 8
  mlp_ratio: 4.0
  mask_ratio: 0.75
  max_sequence_length: 1000
  use_pos_embedding: true

# Training configuration
training:
  learning_rate: 1.0e-4
  weight_decay: 0.05
  warmup_epochs: 10
  max_epochs: 100
  accelerator: auto  # 'cpu', 'gpu', 'tpu', 'auto'
  devices: auto  # number of devices or 'auto'
  log_every_n_steps: 50
  val_check_interval: 1.0  # Check validation every N epochs

# Logger configuration (optional)
logger:
  use_wandb: false
  project: cropfm-mae
  name: mae-baseline

# Data configuration
data:
  zarr_path: /lustre/scratch/WUR/AIN/nedun001/CropFM/data/zarr_files/europe_data_1200_merged_cleaned.zarr
  modalities:
    - agera5
    - sentinel1
    - sentinel2
    - fapar
    - soil
    - elevation
    - worldcereal_cropmask
    - worldcereal_cropcalender

  # NEW: Specify which bands/variables to use for each modality
  modality_bands:
    agera5: [0, 1, 2, 3, 4, 5, 6, 7]  # All 8 variables, or select subset: [0, 1, 2]
    sentinel1: [0, 1, 2]  # All 3 bands (VV, VH, angle)
    sentinel2: [0, 1, 2, 3, 4, 5, 6]  # Select first 7 bands instead of all 13
    fapar: [0, 1]  # FAPAR and LAI
    # Static modalities typically use all bands
    soil: null  # null means use all bands
    elevation: null
    worldcereal_cropmask: null
    worldcereal_cropcalender: null
  batch_size: 32
  num_workers: 4
  train_split: 0.8
  val_split: 0.1
  seed: 42
  pin_memory: True


