# Hydra configuration for CropMAE training
defaults: 
  - base.modalities@data.modalities
  - _self_

hydra:
  job:
    chdir: true
  run:
    dir: experiments/pretrain/test/

seed_everything: &seed_everything 42

# Callbacks configuration
callbacks:
  callbacks_list:
    - checkpoint
    - real_time_memory
    - model_summary
    # - wandb

  checkpoint:
    mode: "min"
    save_top_k: 3
    save_last: True
    dirpath: "model_checkpoints"
    filename: "checkpoint-{epoch:02d}"
  
  wandb:
    project: "cropfm-pretrain"
    name: "cropfm-pretrain"

  model_summary:
    max_depth: 3

# Trainer configuration
trainer:
  default_root_dir: "."
  precision: 32
  devices: 1
  num_nodes: 1
  accelerator: gpu
  strategy: auto
  accumulate_grad_batches: 1
  min_epochs: 1
  max_epochs: 200
  enable_progress_bar: True
  fast_dev_run: False


# Model configuration
model:
  _target_: cropfm.models.arch.mae.CropMAE
  _recursive_: false # prevent hydra from recursively validating the model config.
  weight_decay: 0.05
  learning_rate: 1.5e-4
  warmup_epochs: 10 # still not implemented

  # Architecture hyperparameters
  embedding_dim: 32
  encoder_depth: 2
  encoder_num_heads: 8
  decoder_embed_dim: 128
  decoder_depth: 2
  decoder_num_heads: 8
  mlp_ratio: 4.0
  mask_ratio: 0.75
  max_sequence_length: 1000
  use_pos_embedding: true
  
  # Masking configuration using Hydra _target_ instantiation
  masking:
    _target_: cropfm.models.arch.masking.RandomMasking
    mask_ratio: ${model.mask_ratio}
    # Alternative: StructuredMasking that randomly selects one of 4 strategies
    # _target_: cropfm.models.arch.masking.StructuredMasking
    # mask_ratio: ${model.mask_ratio}
    # modality_mask_ratio: 0.45  # Ratio of modalities to mask
    # timestep_mask_ratio: 0.5   # Ratio of timesteps to mask per modality
    # contiguous_pattern: ["monthly", "first_half", "second_half"]  # Multiple patterns
    # strategy_weights: [0.25, 0.25, 0.25, 0.25]  # [random, modality, timesteps, contiguous]
  
  # Attention configuration using Hydra _target_ instantiation
  encoder_attention:
    _target_: cropfm.models.arch.attention.Attention
    dim: ${model.embedding_dim}
    num_heads: ${model.encoder_num_heads}
    qkv_bias: false
    attn_drop: 0.0
    proj_drop: 0.0
  
  decoder_attention:
    _target_: cropfm.models.arch.attention.Attention
    dim: ${model.decoder_embed_dim}
    num_heads: ${model.decoder_num_heads}
    qkv_bias: false
    attn_drop: 0.0
    proj_drop: 0.0

    # To use sliding window attention instead, change _target_ to:
    # _target_: cropfm.models.arch.attention.SlidingWindowAttention
    # window_size: 64
    # causal: false
  
  # Loss aggregation configuration
  loss_aggregation:
    equal_weighting: true  # If true, average all losses equally. If false, use weights dict below.
    # weights:  # Optional: dict mapping loss name to weight (only used if equal_weighting=false)
    #   reconstruction: 1.0
    #   # Add other loss types here as needed


# Data configuration
data:
  # module parameters
  batch_size: 512  # Increased from 128 to better utilize A100 80GB GPU
  num_workers: 1

  # dataset parameters
  # zarr_path: "${hydra:runtime.cwd}/data/zarr_files/europe_data_1200_merged_cleaned2_rechunked.zarr" # cleaned2 is the old version
  zarr_path: "${oc.env:CROPFM_DATA_DIR}/europe_data_1200_merged_cleaned2_rechunked.zarr"
  # zarr_path: "/scratch-node/vnedungadi.18488199/europe_data_1200_merged_cleaned2_rechunked.zarr"
  train_split: 0.8
  val_split: 0.1
  test_split: 0.1
  seed: *seed_everything
  pin_memory: True