[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cropfm"
version = "0.1.0"
description = "A radio built on Crops :)"
readme = "README.md"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
    "black>=23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cropfm"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/README.md",
    "/pyproject.toml",
]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.isort]
profile = "black"
line_length = 100
src_paths = ["src"]